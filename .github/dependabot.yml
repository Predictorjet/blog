version: 2

# Mises à jour de VERSION uniquement (les correctifs de sécurité sont gérés
# séparément par « Dependabot security updates », déjà activé sur ce dépôt).
updates:
  # PHP / Composer
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      composer-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # JavaScript / npm (Vite)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Actions GitHub — maintient l'épinglage des workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
